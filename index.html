                                </div>

                                <div className="flex-1 overflow-y-auto p-6 space-y-5">
                                    {adminTab === "ai" && (
                                        <div className="space-y-4">
                                            <div className="flex items-center justify-between">
                                                <div className="text-xs text-zinc-400">
                                                    예시: "가격을 350만원으로 바꿔줘", "테마를 에메랄드로 변경", "상태를 판매완료로 변경"
                                                </div>
                                                {aiEditHistory.length > 0 && (
                                                    <button
                                                        type="button"
                                                        onClick={onUndoLastAiEdit}
                                                        className="px-3 py-1.5 rounded-xl bg-zinc-900 border border-zinc-700 text-xs text-amber-200 hover:bg-zinc-800"
                                                    >
                                                        직전 AI 수정 되돌리기 ({aiEditHistory.length})
                                                    </button>
                                                )}
                                            </div>

                                            <div className="h-64 overflow-y-auto p-4 rounded-2xl bg-zinc-900/80 border border-zinc-800 space-y-3">
                                                {studioLogs.map((item, idx) => (
                                                    <div
                                                        key={idx}
                                                        className={`flex ${item.role === "user" ? "justify-end" : "justify-start"}`}
                                                    >
                                                        <div
                                                            className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-xs leading-relaxed whitespace-pre-line ${
                                                                item.role === "user"
                                                                    ? "bg-amber-400 text-zinc-950 font-medium"
                                                                    : "bg-zinc-950 border border-zinc-800 text-stone-100"
                                                            }`}
                                                        >
                                                            {item.text}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>

                                            <form onSubmit={handleStudioSubmit} className="flex gap-2">
                                                <input
                                                    type="text"
                                                    value={studioPrompt}
                                                    onChange={(e) => setStudioPrompt(e.target.value)}
                                                    placeholder="AI에게 사이트 전체 수정 명령을 입력하세요..."
                                                    className="flex-1 px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-800 text-xs text-stone-100"
                                                />
                                                <button
                                                    type="submit"
                                                    className="px-5 py-3 rounded-xl bg-amber-400 text-zinc-950 font-bold text-xs hover:bg-amber-300"
                                                >
                                                    즉시 반영
                                                </button>
                                            </form>
                                        </div>
                                    )}

                                    {adminTab === "watch" && (
                                        <div className="space-y-4 text-xs">
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <div>
                                                    <label className="block text-zinc-400 mb-1">브랜드 로고명</label>
                                                    <input
                                                        type="text"
                                                        value={config.brandLogo}
                                                        onChange={(e) =>
                                                            setConfig((prev) => ({ ...prev, brandLogo: e.target.value }))
                                                        }
                                                        className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-stone-100"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-zinc-400 mb-1">컬러 테마</label>
                                                    <select
                                                        value={config.themeKey || "gold"}
                                                        onChange={(e) =>
                                                            setConfig((prev) => ({ ...prev, themeKey: e.target.value }))
                                                        }
                                                        className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-stone-100"
                                                    >
                                                        {Object.entries(THEME_PRESETS).map(([k, v]) => (
                                                            <option key={k} value={k}>
                                                                {v.label}
                                                            </option>
                                                        ))}
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-zinc-400 mb-1">시계 모델명</label>
                                                    <input
                                                        type="text"
                                                        value={watch.model}
                                                        onChange={(e) =>
                                                            setWatch((prev) => ({ ...prev, model: e.target.value }))
                                                        }
                                                        className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-stone-100"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-zinc-400 mb-1">판매 가격 (원)</label>
                                                    <input
                                                        type="number"
                                                        value={watch.price}
                                                        onChange={(e) =>
                                                            setWatch((prev) => ({ ...prev, price: Number(e.target.value) || 0 }))
                                                        }
                                                        className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-stone-100"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-zinc-400 mb-1">판매 상태</label>
                                                    <select
                                                        value={watch.status}
                                                        onChange={(e) =>
                                                            setWatch((prev) => ({ ...prev, status: e.target.value }))
                                                        }
                                                        className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-stone-100"
                                                    >
                                                        <option value="판매중">판매중</option>
                                                        <option value="예약중">예약중</option>
                                                        <option value="판매완료">판매완료</option>
                                                    </select>
                                                </div>
                                                <div>
                                                    <label className="block text-zinc-400 mb-1">입금 계좌 정보</label>
                                                    <input
                                                        type="text"
                                                        value={config.bankAccount}
                                                        onChange={(e) =>
                                                            setConfig((prev) => ({ ...prev, bankAccount: e.target.value }))
                                                        }
                                                        className="w-full px-3.5 py-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-stone-100"
                                                    />
                                                </div>
                                            </div>

                                            <div className="p-4 rounded-2xl bg-zinc-900 border border-zinc-800 space-y-2.5">
                                                <div className="font-semibold text-stone-200">시계 대표 사진 변경</div>
                                                <div className="flex flex-wrap gap-2">
                                                    <input
                                                        type="text"
                                                        value={photoUrlDraft}
                                                        onChange={(e) => setPhotoUrlDraft(e.target.value)}
                                                        placeholder="이미지 URL 붙여넣기..."
                                                        className="flex-1 min-w-[200px] px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-800 text-stone-100"
                                                    />
                                                    <button
                                                        type="button"
                                                        onClick={onApplyPhotoUrl}
                                                        className="px-3.5 py-2 rounded-xl bg-amber-400 text-zinc-950 font-semibold"
                                                    >
                                                        URL 적용
                                                    </button>
                                                    <label className="px-3.5 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-stone-200 cursor-pointer">
                                                        사진 파일 업로드
                                                        <input
                                                            type="file"
                                                            accept="image/*"
                                                            onChange={onUploadWatchFile}
                                                            className="hidden"
                                                        />
                                                    </label>
                                                </div>
                                                {photoStatusMsg && (
                                                    <div className="text-emerald-300">{photoStatusMsg}</div>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {adminTab === "orders" && (
                                        <div className="space-y-3 text-xs">
                                            {orders.length === 0 ? (
                                                <div className="text-center text-zinc-500 py-8">접수된 주문이 없습니다.</div>
                                            ) : (
                                                orders.map((ord) => (
                                                    <div
                                                        key={ord.id}
                                                        className="p-4 rounded-2xl bg-zinc-900 border border-zinc-800 space-y-2.5"
                                                    >
                                                        <div className="flex flex-wrap items-center justify-between gap-2">
                                                            <div className="font-semibold text-stone-100">
                                                                {ord.id} · 보내는 분: {ord.buyerName} (입금자: {ord.depositorName})
                                                            </div>
                                                            <span className="text-amber-300 font-bold">
                                                                {formatKRW(ord.amount)}
                                                            </span>
                                                        </div>
                                                        <div className="text-zinc-400">
                                                            계정: {ord.email} · 연락처: {ord.contact} · 배송지: {ord.address}
                                                        </div>
                                                        <div className="flex flex-wrap gap-2 pt-1">
                                                            {[
                                                                "계좌이체 완료 · 관리자 확인 대기",
                                                                "입금 확인 완료 · 발송 준비",
                                                                "택배 발송 완료",
                                                            ].map((st) => (
                                                                <button
                                                                    key={st}
                                                                    type="button"
                                                                    onClick={() => onUpdateOrderStatus(ord.id, st)}
                                                                    className={`px-3 py-1.5 rounded-xl border transition ${
                                                                        ord.status === st
                                                                            ? "bg-amber-400 text-zinc-950 font-semibold border-transparent"
                                                                            : "bg-zinc-950 border-zinc-800 text-zinc-300"
                                                                    }`}
                                                                >
                                                                    {st}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    )}

                                    {adminTab === "chat" && (
                                        <div className="space-y-4 text-xs">
                                            <form onSubmit={onSendBroadcast} className="p-4 rounded-2xl bg-zinc-900 border border-zinc-800 space-y-2">
                                                <div className="font-semibold text-amber-200">전체 회원 채팅창 공지 발송</div>
                                                <div className="flex gap-2">
                                                    <input
                                                        type="text"
                                                        value={broadcastInput}
                                                        onChange={(e) => setBroadcastInput(e.target.value)}
                                                        placeholder="모든 회원 채팅창에 표시할 공지 메시지..."
                                                        className="flex-1 px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-800 text-stone-100"
                                                    />
                                                    <button
                                                        type="submit"
                                                        className="px-4 py-2 rounded-xl bg-amber-400 text-zinc-950 font-semibold"
                                                    >
                                                        전체 발송
                                                    </button>
                                                </div>
                                                {broadcastNotice && <div className="text-emerald-300">{broadcastNotice}</div>}
                                            </form>

                                            <form onSubmit={onSendDirectMessage} className="p-4 rounded-2xl bg-zinc-900 border border-zinc-800 space-y-2">
                                                <div className="font-semibold text-stone-100">특정 회원 1:1 답변 전송</div>
                                                <select
                                                    value={selectedRecipientEmail}
                                                    onChange={(e) => setSelectedRecipientEmail(e.target.value)}
                                                    className="w-full px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-800 text-stone-100"
                                                >
                                                    <option value="">답변 받을 회원을 선택하세요</option>
                                                    {customerEmailOptions.map((c) => (
                                                        <option key={c.email} value={c.email}>
                                                            {c.name} ({c.email})
                                                        </option>
                                                    ))}
                                                </select>
                                                <div className="flex gap-2">
                                                    <input
                                                        type="text"
                                                        value={directMessageInput}
                                                        onChange={(e) => setDirectMessageInput(e.target.value)}
                                                        placeholder="회원에게 보낼 1:1 답변 입력..."
                                                        className="flex-1 px-3 py-2 rounded-xl bg-zinc-950 border border-zinc-800 text-stone-100"
                                                    />
                                                    <button
                                                        type="submit"
                                                        className="px-4 py-2 rounded-xl bg-amber-400 text-zinc-950 font-semibold"
                                                    >
                                                        답변 전송
                                                    </button>
                                                </div>
                                                {directMessageNotice && <div className="text-emerald-300">{directMessageNotice}</div>}
                                            </form>

                                            <div className="space-y-2 max-h-56 overflow-y-auto p-3 rounded-2xl bg-zinc-900/60 border border-zinc-800">
                                                {messages.slice().reverse().map((m) => (
                                                    <div key={m.id} className="p-2.5 rounded-xl bg-zinc-950 border border-zinc-800/80">
                                                        <div className="text-[11px] text-zinc-400">
                                                            [{m.targetEmail}] {m.senderName} · {m.timestamp}
                                                        </div>
                                                        <div className="text-stone-200 mt-0.5 whitespace-pre-line">{m.text}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {adminTab === "members" && (
                                        <div className="space-y-4 text-xs">
                                            <div>
                                                <div className="font-semibold text-stone-200 mb-2">
                                                    가입 회원 목록 ({registeredUsers.length}명)
                                                </div>
                                                <div className="space-y-2">
                                                    {registeredUsers.map((u) => (
                                                        <div
                                                            key={u.id}
                                                            className="p-3 rounded-xl bg-zinc-900 border border-zinc-800 flex items-center justify-between"
                                                        >
                                                            <div>
                                                                <span className="font-semibold text-stone-100">{u.name}</span> · {u.email} ({u.phone})
                                                            </div>
                                                            <span className="text-zinc-500">{u.createdAt}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            <div>
                                                <div className="font-semibold text-stone-200 mb-2">
                                                    최근 로그인 접속 로그 ({loginLogs.length}건)
                                                </div>
                                                <div className="space-y-1.5 max-h-48 overflow-y-auto">
                                                    {loginLogs.map((log) => (
                                                        <div
                                                            key={log.id}
                                                            className="p-2.5 rounded-xl bg-zinc-900/70 border border-zinc-800/80 flex items-center justify-between text-zinc-300"
                                                        >
                                                            <span>{log.name} ({log.email})</span>
                                                            <span className="text-zinc-500">{log.time}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // 16. React 루트 마운트
        // ==========================================
        const rootElement = document.getElementById("root");
        const root = ReactDOM.createRoot(rootElement);
        root.render(<OuroAtelierApp />);
    </script>
</body>
</html>
