        function readCookieBackup(key) {
            try {
                if (typeof document === "undefined" || !document.cookie) return null;
                const safeName = encodeURIComponent(key) + "=";
                const parts = document.cookie.split(";");
                for (let i = 0; i < parts.length; i += 1) {
                    const part = parts[i].trim();
                    if (part.indexOf(safeName) === 0) {
                        return decodeURIComponent(part.substring(safeName.length));
                    }
                }
            } catch (_) {}
            return null;
        }

        function writeCookieBackup(key, serialized) {
            try {
                if (typeof document === "undefined") return;
                if (serialized && serialized.length < 3400) {
                    const maxAge = 60 * 60 * 24 * 365;
                    document.cookie = `${encodeURIComponent(key)}=${encodeURIComponent(serialized)}; max-age=${maxAge}; path=/; SameSite=Lax`;
                }
            } catch (_) {}
        }

        function removeCookieBackup(key) {
            try {
                if (typeof document === "undefined") return;
                document.cookie = `${encodeURIComponent(key)}=; max-age=0; path=/; SameSite=Lax`;
            } catch (_) {}
        }

        function syncWindowNameBackup() {

                    if (serializedMirror.length < 2400000) {

        function readStoredJson(key, fallbackValue) {
            try {
                let raw = null;
                if (typeof window !== "undefined" && window.localStorage) {
                    raw = window.localStorage.getItem(key);
                }
                if ((raw === null || raw === undefined) && Object.prototype.hasOwnProperty.call(MEMORY_FALLBACK_STORE, key)) {
                    raw = MEMORY_FALLBACK_STORE[key];
                }
                if (raw === null || raw === undefined) {
                    raw = readCookieBackup(key);
                }
                if (raw !== null && raw !== undefined) {
                    const parsed = JSON.parse(raw);
                    MEMORY_FALLBACK_STORE[key] = raw;
                    return parsed;

                    }
                    const cookieRaw = readCookieBackup(key);
                    if (cookieRaw) {
                        return JSON.parse(cookieRaw);
                    }
                } catch (_) {}
            }
            return fallbackValue;

                            sentAt: Date.now(),
                        });
                    } catch (_) {}
                }
                return true;
            } catch (_) {
                return false;
            }

        // ==========================================
        // 4. 내장 AI 컨시어지 & 관리자 AI 스튜디오 엔진
        // ==========================================
        async function callSiteAssistantAI(promptText, currentConfig, currentWatch, mode = "qa") {
            const raw = String(promptText || "").trim();
            const lower = raw.toLowerCase();

            if (mode === "edit") {
                const configPatch = {};
                const watchPatch = {};
                const changes = [];

                const priceManMatch = raw.match(/(?:가격|금액|판매가)[^\d]*([\d,]+)\s*만\s*원?/);
                const priceWonMatch = raw.match(/(?:가격|금액|판매가)[^\d]*([\d,]+)\s*원/);
                if (priceManMatch) {
                    const nextPrice = Number(priceManMatch[1].replace(/,/g, "")) * 10000;
                    if (!Number.isNaN(nextPrice) && nextPrice >= 0) {
                        watchPatch.price = nextPrice;
                        changes.push(`판매 가격 → ${formatKRW(nextPrice)}`);
                    }
                } else if (priceWonMatch) {
                    const nextPrice = Number(priceWonMatch[1].replace(/,/g, ""));
                    if (!Number.isNaN(nextPrice) && nextPrice >= 0) {
                        watchPatch.price = nextPrice;
                        changes.push(`판매 가격 → ${formatKRW(nextPrice)}`);
                    }
                }

                if (raw.includes("판매완료") || raw.includes("품절") || raw.includes("솔드아웃")) {
                    watchPatch.status = "판매완료";
                    changes.push("판매 상태 → 판매완료");
                } else if (raw.includes("예약중") || raw.includes("예약")) {
                    watchPatch.status = "예약중";
                    changes.push("판매 상태 → 예약중");
                } else if (raw.includes("판매중") || raw.includes("재판매")) {
                    watchPatch.status = "판매중";
                    changes.push("판매 상태 → 판매중");
                }

                if (raw.includes("에메랄드") || raw.includes("초록") || raw.includes("그린")) {
                    configPatch.themeKey = "emerald";
                    changes.push("컬러 테마 → 에메랄드 브리티시");
                } else if (raw.includes("버건디") || raw.includes("루비") || raw.includes("레드") || raw.includes("빨강")) {
                    configPatch.themeKey = "crimson";
                    changes.push("컬러 테마 → 버건디 루비");
                } else if (raw.includes("플래티넘") || raw.includes("실버") || raw.includes("화이트")) {
                    configPatch.themeKey = "platinum";
                    changes.push("컬러 테마 → 플래티넘 실버");
                } else if (raw.includes("골드") || raw.includes("황금")) {
                    configPatch.themeKey = "gold";
                    changes.push("컬러 테마 → 로열 골드");
                }

                const brandMatch = raw.match(/(?:브랜드|로고)(?:명| 이름)?(?:을|를|은|는|:)?\s*["']?([A-Za-z0-9가-힣\s·_-]{2,24})["']?(?:으로|로| 변경| 수정|$)/);
                if (brandMatch && brandMatch[1]) {
                    const nextBrand = brandMatch[1].trim();
                    configPatch.brandLogo = nextBrand;
                    changes.push(`브랜드 로고 → ${nextBrand}`);
                }

                const modelMatch = raw.match(/(?:모델명|시계\s*이름)(?:을|를|은|는|:)?\s*["']?([^"'\n]{2,50})["']?(?:으로|로| 변경| 수정|$)/);
                if (modelMatch && modelMatch[1]) {
                    const nextModel = modelMatch[1].trim();
                    watchPatch.model = nextModel;
                    changes.push(`모델명 → ${nextModel}`);
                }

                const bannerMatch = raw.match(/(?:배너|상단\s*문구|공지)(?:을|를|은|는|:)?\s*["']?([^"'\n]{3,60})["']?(?:으로|로| 변경| 수정|$)/);
                if (bannerMatch && bannerMatch[1]) {
                    const nextBanner = bannerMatch[1].trim();
                    configPatch.topBannerSubtitle = nextBanner;
                    changes.push(`상단 배너 문구 → ${nextBanner}`);
                }

                const bankHolderMatch = raw.match(/예금주(?:를|을|는|은|:)?\s*["']?([가-힣A-Za-z0-9\s]{2,20})["']?(?:으로|로|$)/);
                if (bankHolderMatch && bankHolderMatch[1]) {
                    configPatch.bankHolder = bankHolderMatch[1].trim();
                    changes.push(`예금주 → ${configPatch.bankHolder}`);
                }

                if (changes.length > 0) {
                    return {
                        applied: true,
                        configPatch,
                        watchPatch,
                        reply: `요청하신 사항을 사이트 전체에 즉시 반영했습니다:\n• ${changes.join("\n• ")}`,
                    };
                }
            }

            if (lower.includes("가격") || lower.includes("얼마") || lower.includes("금액")) {
                return {
                    applied: false,
                    reply: `현재 '${currentWatch.model}'의 아카이브 분양가는 ${formatKRW(currentWatch.price)}이며, 현재 상태는 [${currentWatch.status}]입니다.`,
                };
            }
            if (lower.includes("계좌") || lower.includes("입금") || lower.includes("이체") || lower.includes("결제")) {
                return {
                    applied: false,
                    reply: `입금 계좌 안내입니다:\n• 은행: ${currentConfig.bankName}\n• 계좌번호: ${currentConfig.bankAccount}\n• 예금주: ${currentConfig.bankHolder}\n\n이체 후 본문의 '계좌이체 주문서'에서 본인 이름과 배송지를 직접 입력해 [계좌이체 완료] 버튼을 눌러주세요.`,
                };
            }
            if (lower.includes("제원") || lower.includes("스펙") || lower.includes("무브먼트") || lower.includes("크기") || lower.includes("방수") || lower.includes("구성품")) {
                return {
                    applied: false,
                    reply: `[${currentWatch.model}] 주요 제원 안내:\n• 레퍼런스: ${currentWatch.reference}\n• 무브먼트: ${currentWatch.caliber} (${currentWatch.powerReserve})\n• 케이스/다이얼: ${currentWatch.caseSize} / ${currentWatch.dial}\n• 방수: ${currentWatch.waterResistance}\n• 컨디션: ${currentWatch.condition}\n• 구성품: ${currentWatch.components}`,
                };
            }
            if (lower.includes("배송") || lower.includes("택배") || lower.includes("발송")) {
                return {
                    applied: false,
                    reply: `계좌이체 완료 등록 후 관리자가 입금을 확인하면 [입금 확인 완료 · 발송 준비] → [택배 발송 완료] 순서로 실시간 상태가 업데이트되며, 상단 주문 조회에서 즉시 진행 단계를 확인하실 수 있습니다.`,
                };
            }
            if (lower.includes("상태") || lower.includes("구매 가능") || lower.includes("재고")) {
                return {
                    applied: false,
                    reply: `현재 '${currentWatch.model}'은(는) [${currentWatch.status}] 상태입니다. ${
                        currentWatch.status === "판매중"
                            ? "지금 바로 계좌이체 주문서를 작성해 구매하실 수 있습니다."
                            : "자세한 일정은 1:1 채팅으로 문의해 주세요."
                    }`,
                };
            }

            return {
                applied: false,
                reply:
                    mode === "edit"
                        ? `현재 사이트 설정(${currentConfig.brandLogo}, ${formatKRW(currentWatch.price)}, ${currentWatch.status})이 적용되어 있습니다. 예: "가격을 250만원으로 변경해줘", "테마를 에메랄드로 바꿔줘", "상태를 예약중으로 변경"처럼 입력하시면 즉시 전체 사이트에 반영됩니다.`
                        : `안녕하세요, ${currentConfig.brandLogo} AI 컨시어지입니다. '${currentWatch.model}'(${formatKRW(currentWatch.price)}, ${currentWatch.status})에 대해 가격, 제원, 구성품, 입금 계좌, 배송 절차 등 궁금한 점을 질문해 주시면 바로 안내해 드립니다.`,
            };
        }

        // ==========================================
        // 5. 메인 애플리케이션 컴포넌트

            const [viewAngle, setViewAngle] = useState("dial");
            const [photoRevision, setPhotoRevision] = useState(1);

            const [orderForm, setOrderForm] = useState({
                buyerName: "",
                contact: "",
                address: "",
                gender: "",
                depositorName: "",
                memo: "",
            });
            const [orderFeedback, setOrderFeedback] = useState("");
            const [latestReceipt, setLatestReceipt] = useState(null);

            // 관리자 콘솔 상태
            const [adminOpen, setAdminOpen] = useState(false);
            const [isAdminAuthed, setIsAdminAuthed] = useState(() =>

            const [adminIdInput, setAdminIdInput] = useState("");
            const [adminPwInput, setAdminPwInput] = useState("");
            const [adminLoginError, setAdminLoginError] = useState("");
            const [adminTab, setAdminTab] = useState("ai");

            const [photoUrlDraft, setPhotoUrlDraft] = useState(() => watch.imageUrl || "");
            const [photoStatusMsg, setPhotoStatusMsg] = useState("");

            const [broadcastInput, setBroadcastInput] = useState("");
            const [broadcastNotice, setBroadcastNotice] = useState("");
            const [selectedRecipientEmail, setSelectedRecipientEmail] = useState("");
            const [directMessageInput, setDirectMessageInput] = useState("");
            const [directMessageNotice, setDirectMessageNotice] = useState("");

            const [aiEditHistory, setAiEditHistory] = useState([]);

            const activeTheme = THEME_PRESETS[config.themeKey] || THEME_PRESETS.gold;

            // ==========================================
            // 6. Firebase RTDB 실시간 구독 & 영구 스토리지 동기화
            // ==========================================
            useEffect(() => {
                if (!rtdb) return;

                const subscriptions = [
                    {
                        ref: rtdb.ref("ouro_atelier/config"),
                        storageKey: "ouro_config_v3",
                        apply: (val) => {
                            if (val && typeof val === "object") {
                                setConfig((prev) => ({ ...prev, ...val }));
                            }
                        },
                    },
                    {
                        ref: rtdb.ref("ouro_atelier/watch"),
                        storageKey: "ouro_watch_v3",
                        apply: (val) => {
                            if (val && typeof val === "object") {
                                setWatch((prev) => ({
                                    ...prev,
                                    ...val,
                                    imageUrl: normalizeImageSrc(val.imageUrl, prev.imageUrl),
                                }));
                                setPhotoRevision((r) => r + 1);
                            }
                        },
                    },
                    {
                        ref: rtdb.ref("ouro_atelier/users"),
                        storageKey: "ouro_registered_users_v3",
                        apply: (val) => {
                            const list = Array.isArray(val) ? val.filter(Boolean) : val && typeof val === "object" ? Object.values(val) : null;
                            if (list) setRegisteredUsers(list);
                        },
                    },
                    {
                        ref: rtdb.ref("ouro_atelier/orders"),
                        storageKey: "ouro_orders_v3",
                        apply: (val) => {
                            const list = Array.isArray(val) ? val.filter(Boolean) : val && typeof val === "object" ? Object.values(val) : null;
                            if (list) setOrders(list);
                        },
                    },
                    {
                        ref: rtdb.ref("ouro_atelier/messages"),
                        storageKey: "ouro_messages_v3",
                        apply: (val) => {
                            const list = Array.isArray(val) ? val.filter(Boolean) : val && typeof val === "object" ? Object.values(val) : null;
                            if (list && list.length > 0) setMessages(list);
                        },
                    },
                    {
                        ref: rtdb.ref("ouro_atelier/loginLogs"),
                        storageKey: "ouro_login_logs_v3",
                        apply: (val) => {
                            const list = Array.isArray(val) ? val.filter(Boolean) : val && typeof val === "object" ? Object.values(val) : null;
                            if (list) setLoginLogs(list);
                        },
                    },
                ];

                const bound = subscriptions.map(({ ref, storageKey, apply }) => {
                    const cb = (snap) => {
                        const val = snap.val();
                        if (val !== null && val !== undefined) {
                            apply(val);
                            writeStoredJson(storageKey, val, { broadcast: false });
                        }
                    };
                    ref.on("value", cb);
                    return { ref, cb };
                });

                return () => {
                    bound.forEach(({ ref, cb }) => ref.off("value", cb));
                };
            }, []);

            useEffect(() => {
                writeStoredJson("ouro_config_v3", config);
                writeRtdbValue("ouro_atelier/config", config);
            }, [config]);

            useEffect(() => {
                writeStoredJson("ouro_watch_v3", watch);
                writeRtdbValue("ouro_atelier/watch", watch);
                setPhotoUrlDraft(watch.imageUrl || "");
            }, [watch]);

            useEffect(() => {
                writeStoredJson("ouro_registered_users_v3", registeredUsers);
                writeRtdbValue("ouro_atelier/users", registeredUsers);
            }, [registeredUsers]);

            useEffect(() => {
                writeStoredJson("ouro_orders_v3", orders);
                writeRtdbValue("ouro_atelier/orders", orders);
            }, [orders]);

            useEffect(() => {
                writeStoredJson("ouro_messages_v3", messages);
                writeRtdbValue("ouro_atelier/messages", messages);
            }, [messages]);

            useEffect(() => {
                writeStoredJson("ouro_login_logs_v3", loginLogs);
                writeRtdbValue("ouro_atelier/loginLogs", loginLogs);
            }, [loginLogs]);

            useEffect(() => {
                if (entranceSession) {
                    writeStoredJson("ouro_entrance_session_v3", entranceSession);
                    writeStoredJson("ouro_last_email_v3", entranceSession.email);
                }
            }, [entranceSession]);

            useEffect(() => {
                writeStoredJson("ouro_admin_authed_v3", isAdminAuthed);
            }, [isAdminAuthed]);

            useEffect(() => {
                const flushBeforeUnload = () => {
                    writeStoredJson("ouro_registered_users_v3", registeredUsers, { broadcast: false });
                    writeStoredJson("ouro_orders_v3", orders, { broadcast: false });
                    writeStoredJson("ouro_messages_v3", messages, { broadcast: false });
                    writeStoredJson("ouro_login_logs_v3", loginLogs, { broadcast: false });
                    if (entranceSession) {
                        writeStoredJson("ouro_entrance_session_v3", entranceSession, { broadcast: false });
                        writeStoredJson("ouro_last_email_v3", entranceSession.email, { broadcast: false });
                    }
                    syncWindowNameBackup();
                };
                window.addEventListener("beforeunload", flushBeforeUnload);
                window.addEventListener("pagehide", flushBeforeUnload);
                return () => {
                    window.removeEventListener("beforeunload", flushBeforeUnload);
                    window.removeEventListener("pagehide", flushBeforeUnload);
                };
            }, [registeredUsers, orders, messages, loginLogs, entranceSession]);

            useEffect(() => {
                const applySyncedPayload = (key, value) => {
                    if (!key || value === null || value === undefined) return;
                    if (key === "ouro_config_v3") {
                        setConfig((prev) => ({ ...prev, ...value }));
                    } else if (key === "ouro_watch_v3") {
                        const nextImg = normalizeImageSrc(value.imageUrl, INITIAL_WATCH.imageUrl);
                        setWatch((prev) => ({ ...prev, ...value, imageUrl: nextImg }));
                        setPhotoRevision((r) => r + 1);
                    } else if (key === "ouro_registered_users_v3" && Array.isArray(value)) {
                        setRegisteredUsers(value);
                    } else if (key === "ouro_orders_v3" && Array.isArray(value)) {
                        setOrders(value);
                    } else if (key === "ouro_messages_v3" && Array.isArray(value)) {
                        setMessages(value);
                    } else if (key === "ouro_login_logs_v3" && Array.isArray(value)) {
                        setLoginLogs(value);
                    }
                };

                const handleBroadcast = (event) => {
                    const payload = event.data;
                    if (!payload || !payload.key) return;
                    applySyncedPayload(payload.key, payload.value);
                };

                const handleStorageEvent = (event) => {
                    if (!event.key || !event.newValue) return;
                    try {
                        const parsed = JSON.parse(event.newValue);
                        MEMORY_FALLBACK_STORE[event.key] = event.newValue;
                        applySyncedPayload(event.key, parsed);
                    } catch (_) {}
                };

                if (LIVE_SYNC_CHANNEL) {
                    LIVE_SYNC_CHANNEL.addEventListener("message", handleBroadcast);
                }
                window.addEventListener("storage", handleStorageEvent);

                return () => {
                    if (LIVE_SYNC_CHANNEL) {
                        LIVE_SYNC_CHANNEL.removeEventListener("message", handleBroadcast);
                    }
                    window.removeEventListener("storage", handleStorageEvent);
                };
            }, []);

            useEffect(() => {
                if (chatOpen && chatBottomRef.current) {
                    chatBottomRef.current.scrollIntoView({ behavior: "smooth" });
                }
            }, [chatOpen, messages, chatAiReplying]);

            // ==========================================
            // 7. 파생 데이터 (회원별 채팅 & 주문 필터링)
            // ==========================================
            const currentUserEmail = normalizeEmail(entranceSession?.email);

            const visibleMessages = useMemo(() => {
                if (!currentUserEmail) return [];
                return messages.filter((msg) => {
                    const target = normalizeEmail(msg.targetEmail);
                    const sender = normalizeEmail(msg.senderEmail);
                    return (
                        msg.targetEmail === "ALL" ||
                        target === currentUserEmail ||
                        sender === currentUserEmail
                    );
                });
            }, [messages, currentUserEmail]);

            const accountOrders = useMemo(() => {
                if (!currentUserEmail) return [];
                return orders.filter((ord) => normalizeEmail(ord.email) === currentUserEmail);
            }, [orders, currentUserEmail]);

            const matchedOrders = useMemo(() => {
                const q = orderLookupQuery.trim().toLowerCase();
                const baseList = showAllAccountOrders ? orders : accountOrders;
                if (!q) return baseList;
                return orders.filter(
                    (ord) =>
                        (ord.id || "").toLowerCase().includes(q) ||
                        (ord.buyerName || "").toLowerCase().includes(q) ||
                        (ord.depositorName || "").toLowerCase().includes(q) ||
                        (ord.contact || "").toLowerCase().includes(q)
                );
            }, [orders, accountOrders, orderLookupQuery, showAllAccountOrders]);

            const customerEmailOptions = useMemo(() => {
                const map = new Map();
                registeredUsers.forEach((u) => {
                    const em = normalizeEmail(u.email);
                    if (em) map.set(em, { email: em, name: u.name || em.split("@")[0], phone: u.phone || "" });
                });
                orders.forEach((o) => {
                    const em = normalizeEmail(o.email);
                    if (em && !map.has(em)) {
                        map.set(em, { email: em, name: o.buyerName || em.split("@")[0], phone: o.contact || "" });
                    }
                });
                return Array.from(map.values());
            }, [registeredUsers, orders]);

            // ==========================================
            // 8. 회원가입 & 로그인 / 로그아웃 핸들러
            // ==========================================
            function handleRegisterSubmit(e) {
                if (e && e.preventDefault) e.preventDefault();
                setGateError("");
                setGateNotice("");

                const cleanName = authNameInput.trim();
                const cleanEmail = normalizeEmail(authEmailInput);
                const cleanPassword = authPasswordInput.trim();
                const cleanPhone = authPhoneInput.trim();

                if (!cleanName) {
                    setGateError("회원가입에 사용할 이름을 입력해 주세요.");
                    return;
                }
                if (!cleanEmail || !cleanEmail.includes("@")) {
                    setGateError("유효한 이메일 주소를 입력해 주세요.");
                    return;
                }
                if (cleanPassword.length < 4) {
                    setGateError("비밀번호를 4자 이상 입력해 주세요.");
                    return;
                }
                if (!cleanPhone || cleanPhone.replace(/[^0-9]/g, "").length < 8) {
                    setGateError("연락 가능한 전화번호를 입력해 주세요.");
                    return;
                }

                const alreadyExists = registeredUsers.some(
                    (u) => normalizeEmail(u.email) === cleanEmail
                );
                if (alreadyExists) {
                    setGateError("이미 가입된 이메일입니다. [로그인] 탭에서 로그인해 주세요.");
                    return;
                }

                const newUser = {
                    id: `usr-${Date.now()}`,
                    name: cleanName,
                    email: cleanEmail,
                    password: cleanPassword,
                    phone: cleanPhone,
                    createdAt: formatDateTimeNow(),
                };

                const nextUsers = [newUser, ...registeredUsers];
                setRegisteredUsers(nextUsers);
                writeStoredJson("ouro_registered_users_v3", nextUsers);
                writeStoredJson("ouro_last_email_v3", cleanEmail);
                writeRtdbValue("ouro_atelier/users", nextUsers);

                setAuthMode("login");
                setAuthPasswordInput("");
                setGateNotice("회원가입이 완료되어 영구 저장되었습니다. 앱을 나가거나 새로고침해도 유지됩니다.");
            }

            function handleGateLogin(e) {
                if (e && e.preventDefault) e.preventDefault();
                setGateError("");
                setGateNotice("");

                const cleanEmail = normalizeEmail(authEmailInput);
                const cleanPassword = authPasswordInput.trim();

                if (!cleanEmail || !cleanEmail.includes("@")) {
                    setGateError("가입하신 이메일 주소를 입력해 주세요.");
                    return;
                }
                if (!cleanPassword) {
                    setGateError("비밀번호를 입력해 주세요.");
                    return;
                }

                const matchedUser = registeredUsers.find(
                    (u) => normalizeEmail(u.email) === cleanEmail
                );
                if (!matchedUser) {
                    setGateError("등록되지 않은 회원입니다. 먼저 [회원가입]을 진행해 주세요.");
                    return;
                }
                if (matchedUser.password !== cleanPassword) {
                    setGateError("비밀번호가 일치하지 않습니다.");
                    return;
                }

                setIsSigningIn(true);
                setTimeout(() => {
                    const sessionData = {
                        userId: matchedUser.id,
                        name: matchedUser.name,
                        email: matchedUser.email,
                        phone: matchedUser.phone,
                        loggedInAt: formatDateTimeNow(),
                    };

                    setEntranceSession(sessionData);
                    setAuthPasswordInput("");
                    setOrderForm((prev) => ({
                        ...prev,
                        buyerName: "",
                        depositorName: "",
                        contact: matchedUser.phone || "",
                    }));

                    setLoginLogs((prev) => [
                        {
                            id: `log-${Date.now()}`,
                            name: matchedUser.name,
                            email: matchedUser.email,
                            phone: matchedUser.phone,
                            time: formatDateTimeNow(),
                        },
                        ...prev.slice(0, 99),
                    ]);

                    setIsSigningIn(false);
                    setGateNotice("");
                }, 200);
            }

            function handleLogout() {
                setEntranceSession(null);
                setChatOpen(false);
                setGateError("");
                setGateNotice("로그아웃되었습니다. 기존 구매 내역과 1:1 채팅 내역은 안전하게 저장되어 있습니다.");
                removeStoredKey("ouro_entrance_session_v3");
            }

            // ==========================================
            // 9. 주문 & 1:1 채팅 + AI 자동 응답 핸들러
            // ==========================================
            function handleCopyAccount() {
                const text = `${config.bankName} ${config.bankAccount} (${config.bankHolder})`;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).catch(() => {});
                } else {
                    const ta = document.createElement("textarea");
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    try { document.execCommand("copy"); } catch (_) {}
                    document.body.removeChild(ta);
                }
                setCopiedAccount(true);
                setTimeout(() => setCopiedAccount(false), 2000);
            }

            function handleCompleteBankTransfer(e) {
                if (e && e.preventDefault) e.preventDefault();
                setOrderFeedback("");

                if (!orderForm.buyerName.trim()) {
                    setOrderFeedback("보내는 사람(구매자) 이름을 직접 입력해 주세요.");
                    return;
                }
                if (!orderForm.contact.trim()) {
                    setOrderFeedback("연락 가능한 전화번호를 입력해 주세요.");
                    return;
                }
                if (!orderForm.address.trim()) {
                    setOrderFeedback("배송 받으실 주소를 입력해 주세요.");
                    return;
                }
                if (!orderForm.gender) {
                    setOrderFeedback("성별을 선택해 주세요.");
                    return;
                }

                const buyer = orderForm.buyerName.trim();
                const depositor = (orderForm.depositorName || buyer).trim();
                const userEmail = currentUserEmail || "member@ouro.com";
                const receiptId = `ORD-${Date.now().toString().slice(-6)}`;

                const newOrder = {
                    id: receiptId,
                    watchModel: watch.model,
                    reference: watch.reference,
                    amount: watch.price,
                    buyerName: buyer,
                    contact: orderForm.contact.trim(),
                    address: orderForm.address.trim(),
                    gender: orderForm.gender,
                    depositorName: depositor,
                    memo: orderForm.memo.trim(),
                    email: userEmail,
                    status: "계좌이체 완료 · 관리자 확인 대기",
                    createdAt: formatDateTimeNow(),
                };

                setOrders((prev) => [newOrder, ...prev]);
                setLatestReceipt(newOrder);

                setMessages((prev) => [
                    ...prev,
                    {
                        id: `msg-ord-${Date.now()}`,
                        sender: "admin",
                        senderName: "OURO 주문·AI 알림",
                        targetEmail: userEmail,
                        text: `[주문 접수 완료 · ${receiptId}]\n• 모델: ${watch.model}\n• 결제금액: ${formatKRW(watch.price)}\n• 보내는 분 / 입금자: ${buyer} (${depositor})\n• 배송지: ${orderForm.address.trim()}\n\n계좌이체 접수 내역이 저장되었습니다. 입금 확인 후 택배 발송 상태로 업데이트됩니다.`,
                        timestamp: formatTimeNow(),
                    },
                ]);

                setOrderForm((prev) => ({
                    ...prev,
                    buyerName: "",
                    depositorName: "",
                    memo: "",
                }));
            }

            function handleChatFileSelect(e) {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    if (typeof reader.result === "string") {
                        setChatAttachment(reader.result);
                    }
                };
                reader.readAsDataURL(file);
                e.target.value = "";
            }

            async function handleSendChat(e) {
                if (e && e.preventDefault) e.preventDefault();
                const text = chatInput.trim();
                if (!text && !chatAttachment) return;

                const userEmail = currentUserEmail || "member@ouro.com";
                const userName = entranceSession?.name || userEmail.split("@")[0];

                const newMsg = {
                    id: `msg-u-${Date.now()}`,
                    sender: "user",
                    senderName: userName,
                    senderEmail: userEmail,
                    targetEmail: userEmail,
                    text: text || "(이미지 첨부)",
                    attachment: chatAttachment,
                    timestamp: formatTimeNow(),
                };

                setMessages((prev) => [...prev, newMsg]);
                setChatInput("");
                setChatAttachment(null);

                if (chatAutoAiEnabled && text) {
                    setChatAiReplying(true);
                    setChatStatusNotice("AI 컨시어지가 질문 내용을 분석해 자동 답변을 작성 중입니다...");
                    try {
                        const aiMode = isAdminAuthed ? "edit" : "qa";
                        const aiRes = await callSiteAssistantAI(text, config, watch, aiMode);
                        const aiReplyText =
                            aiRes?.reply ||
                            `${watch.model} (${formatKRW(watch.price)}, ${watch.status}) 관련 문의를 확인했습니다. 추가 질문이 있으시면 편하게 남겨주세요.`;

                        setMessages((prev) => [
                            ...prev,
                            {
                                id: `msg-ai-${Date.now() + 1}`,
                                sender: "admin",
                                senderName: "OURO AI 자동응답",
                                targetEmail: userEmail,
                                text: aiReplyText,
                                timestamp: formatTimeNow(),
                            },
                        ]);
                        setChatStatusNotice("AI 자동 답변이 등록되었습니다. 관리자도 대화 내역을 함께 확인합니다.");
                    } catch (_) {
                        setChatStatusNotice("메시지가 전송되었습니다. 관리자가 확인 후 순차 답변해 드립니다.");
                    } finally {
                        setChatAiReplying(false);
                    }
                } else {
                    setChatStatusNotice("메시지가 전송되었습니다. 관리자가 확인 후 순차 답변해 드립니다.");
                }
            }

            // ==========================================
            // 10. 관리자 전용 인증 & 실시간 사이트 수정 핸들러
            // ==========================================
            function handleAdminLogin(e) {
                if (e && e.preventDefault) e.preventDefault();
                setAdminLoginError("");
                if (adminIdInput.trim() === ADMIN_ID && adminPwInput.trim() === ADMIN_PASSCODE) {
                    setIsAdminAuthed(true);
                    setAdminIdInput("");
                    setAdminPwInput("");
                } else {
                    setAdminLoginError("관리자 아이디 또는 비밀번호가 올바르지 않습니다.");
                }
            }

            function handleAdminLogout() {
                setIsAdminAuthed(false);
                setAdminOpen(false);
            }

            function handleAdminApplyPhotoUrl() {
                const nextUrl = normalizeImageSrc(photoUrlDraft, "");
                if (!nextUrl) {
                    setPhotoStatusMsg("유효한 이미지 URL 또는 업로드 파일을 선택해 주세요.");
                    return;
                }
                setWatch((prev) => ({ ...prev, imageUrl: nextUrl }));
                setPhotoRevision((r) => r + 1);
                setPhotoStatusMsg("시계 대표 사진이 사이트 전체에 즉시 반영되었습니다.");
                setPhotoToast("대표 사진이 실시간 업데이트되었습니다.");
                setTimeout(() => setPhotoToast(""), 2500);
            }

            function handleAdminUploadWatchFile(e) {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    if (typeof reader.result === "string") {
                        setWatch((prev) => ({ ...prev, imageUrl: reader.result }));
                        setPhotoUrlDraft(reader.result);
                        setPhotoRevision((r) => r + 1);
                        setPhotoStatusMsg("로컬 이미지 파일이 시계 대표 사진으로 즉시 반영되었습니다.");
                    }
                };
                reader.readAsDataURL(file);
                e.target.value = "";
            }

            function handleUpdateOrderStatus(orderId, nextStatus) {
                setOrders((prev) =>
                    prev.map((ord) => (ord.id === orderId ? { ...ord, status: nextStatus } : ord))
                );
                const targetOrder = orders.find((o) => o.id === orderId);
                if (targetOrder && targetOrder.email) {
                    setMessages((prev) => [
                        ...prev,
                        {
                            id: `msg-st-${Date.now()}`,
                            sender: "admin",
                            senderName: "OURO 관리자",
                            targetEmail: normalizeEmail(targetOrder.email),
                            text: `[주문 상태 변경 안내 · ${orderId}]\n주문하신 '${targetOrder.watchModel}'의 진행 상태가 [${nextStatus}](으)로 업데이트되었습니다.`,
                            timestamp: formatTimeNow(),
                        },
                    ]);
                }
            }

            function handleAdminBroadcast(e) {
                if (e && e.preventDefault) e.preventDefault();
                const text = broadcastInput.trim();
                if (!text) return;
                setMessages((prev) => [
                    ...prev,
                    {
                        id: `msg-bc-${Date.now()}`,
                        sender: "admin",
                        senderName: "OURO 관리자 전체공지",
                        targetEmail: "ALL",
                        text,
                        timestamp: formatTimeNow(),
                    },
                ]);
                setBroadcastInput("");
                setBroadcastNotice("전체 회원 채팅창에 공지 메시지가 발송되었습니다.");
                setTimeout(() => setBroadcastNotice(""), 3000);
            }

            function handleAdminDirectMessage(e) {
                if (e && e.preventDefault) e.preventDefault();
                const recipient = normalizeEmail(selectedRecipientEmail);
                const text = directMessageInput.trim();
                if (!recipient || !text) return;

                setMessages((prev) => [
                    ...prev,
                    {
                        id: `msg-dm-${Date.now()}`,
                        sender: "admin",
                        senderName: "OURO 관리자",
                        targetEmail: recipient,
                        text,
                        timestamp: formatTimeNow(),
                    },
                ]);
                setDirectMessageInput("");
                setDirectMessageNotice(`${recipient} 회원에게 1:1 답변이 전송되었습니다.`);
                setTimeout(() => setDirectMessageNotice(""), 3000);
            }

            async function handleAdminAiSiteEdit(instructionText) {
                if (!isAdminAuthed) {
                    return {
                        applied: false,
                        reply: "사이트 전체 수정 권한은 관리자 인증 후에만 사용할 수 있습니다.",
                    };
                }
                const prevSnapshot = {
                    config: { ...config },
                    watch: { ...watch },
                    time: formatTimeNow(),
                    prompt: instructionText,
                };

                const res = await callSiteAssistantAI(instructionText, config, watch, "edit");
                if (res && res.applied) {
                    setAiEditHistory((prev) => [prevSnapshot, ...prev.slice(0, 9)]);
                    if (res.configPatch && Object.keys(res.configPatch).length > 0) {
                        setConfig((prev) => ({ ...prev, ...res.configPatch }));
                    }
                    if (res.watchPatch && Object.keys(res.watchPatch).length > 0) {
                        setWatch((prev) => ({ ...prev, ...res.watchPatch }));
                    }
                }
                return res;
            }

            function handleUndoLastAiEdit() {
                if (aiEditHistory.length === 0) return;
                const [latest, ...rest] = aiEditHistory;
                setConfig(latest.config);
                setWatch(latest.watch);
                setAiEditHistory(rest);
            }

                                </div>

                                        onClick={() => setSiteAiOpen(true)}
                                        className="px-3 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-xs text-amber-200 flex items-center gap-1.5 transition"
                                    >
                                        <Sparkles className="w-3.5 h-3.5" />
                                        <span>사이트 AI 안내</span>
                                    </button>
                                    <button
                                        type="button"
                                        onClick={() => setAdminOpen(true)}
                                        className="px-3 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-xs text-zinc-300 flex items-center gap-1.5 transition"

                                        <Lock className="w-3.5 h-3.5" />
                                        <span>관리자</span>

                                <div className="text-center mb-6">
                                    <div className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full border text-[11px] tracking-widest uppercase mb-3 ${activeTheme.badgeBg}`}>
                                        <ShieldCheck className="w-3.5 h-3.5" />

                                        <br />

                                <div className="grid grid-cols-2 gap-2 p-1 rounded-2xl bg-zinc-900 border border-zinc-800 mb-6">
                                    <button
                                        type="button"
                                        onClick={() => {
                                            setAuthMode("login");
                                            setGateError("");
                                            setGateNotice("");
                                        }}
                                        className={`py-2.5 rounded-xl text-xs font-semibold transition ${
                                            authMode === "login"
                                                ? `bg-gradient-to-r ${activeTheme.btnGrad} shadow`

                                    </button>
                                    <button

                                        className={`py-2.5 rounded-xl text-xs font-semibold transition ${

                                                ? `bg-gradient-to-r ${activeTheme.btnGrad} shadow`

                                                value={authEmailInput}
                                                onChange={(e) => setAuthEmailInput(e.target.value)}
                                                placeholder="example@gmail.com"
                                                className="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-800 text-sm text-stone-100 focus:outline-none focus:border-amber-500/60"
                                            />

                                            <label className="block text-xs text-zinc-400 mb-1.5">
                                                비밀번호

                                            <input

                                                placeholder="가입 시 설정한 비밀번호"
                                                className="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-800 text-sm text-stone-100 focus:outline-none focus:border-amber-500/60"

                                            <input
                                                type="text"
                                                value={authNameInput}
                                                onChange={(e) => setAuthNameInput(e.target.value)}
                                                placeholder="홍길동"

        // ==========================================
        // 14. 사이트 내장 AI 도우미 모달
        // ==========================================
        function SiteAssistantModal({ onClose, config, watch, isAdminAuthed, onAdminApplyEdit }) {
            const [prompt, setPrompt] = useState("");
            const [logs, setLogs] = useState([
                {
                    role: "ai",
                    text: isAdminAuthed
                        ? "관리자 권한이 활성화되어 있습니다. 질문 응답은 물론, '가격을 250만원으로 바꿔줘', '테마를 에메랄드로 변경해줘'처럼 입력하시면 사이트 전체가 즉시 수정됩니다."
                        : `안녕하세요! ${config.brandLogo} 사이트 AI 컨시어지입니다. 시계 가격, 무브먼트 제원, 입금 계좌, 배송 절차 등을 질문하시면 즉시 답변해 드립니다.`,
                },
            ]);
            const [busy, setBusy] = useState(false);

            async function handleAsk(e) {
                if (e && e.preventDefault) e.preventDefault();
                const q = prompt.trim();
                if (!q) return;
                setLogs((prev) => [...prev, { role: "user", text: q }]);
                setPrompt("");
                setBusy(true);

                try {
                    const res = isAdminAuthed
                        ? await onAdminApplyEdit(q)
                        : await callSiteAssistantAI(q, config, watch, "qa");
                    setLogs((prev) => [...prev, { role: "ai", text: res.reply }]);
                } finally {
                    setBusy(false);
                }
            }

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="w-full max-w-lg rounded-3xl bg-zinc-950 border border-zinc-800 shadow-2xl overflow-hidden flex flex-col max-h-[82vh]">
                        <div className="px-5 py-4 bg-zinc-900 border-b border-zinc-800 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <Sparkles className="w-4 h-4 text-amber-300" />
                                <span className="text-sm font-bold text-stone-100">
                                    {isAdminAuthed ? "OURO 관리자 AI 사이트 스튜디오" : "OURO AI 컨시어지"}
                                </span>
                            </div>
                            <button
                                type="button"
                                onClick={onClose}
                                className="p-1.5 rounded-xl bg-zinc-950 text-zinc-400 hover:text-stone-100"
                            >
                                <X className="w-4 h-4" />
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {logs.map((item, i) => (
                                <div
                                    key={i}
                                    className={`flex ${item.role === "user" ? "justify-end" : "justify-start"}`}
                                >
                                    <div
                                        className={`max-w-[85%] rounded-2xl px-4 py-2.5 text-xs leading-relaxed whitespace-pre-line ${
                                            item.role === "user"
                                                ? "bg-amber-400 text-zinc-950 font-medium"
                                                : "bg-zinc-900 border border-zinc-800 text-stone-100"
                                        }`}
                                    >
                                        {item.text}
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="px-4 py-2 bg-zinc-900/60 border-t border-zinc-800/80 flex flex-wrap gap-1.5">
                            {(isAdminAuthed
                                ? ["가격을 150만원으로 변경", "테마를 에메랄드로 변경", "상태를 예약중으로 변경"]
                                : ["가격이 얼마인가요?", "입금 계좌 알려줘", "시계 제원 알려줘"]
                            ).map((chip) => (
                                <button
                                    key={chip}
                                    type="button"
                                    onClick={() => setPrompt(chip)}
                                    className="px-2.5 py-1 rounded-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-[11px] text-zinc-300"
                                >
                                    {chip}
                                </button>
                            ))}
                        </div>

                        <form onSubmit={handleAsk} className="p-3.5 bg-zinc-950 border-t border-zinc-800 flex gap-2">
                            <input
                                type="text"
                                value={prompt}
                                onChange={(e) => setPrompt(e.target.value)}
                                placeholder={
                                    isAdminAuthed
                                        ? "사이트 수정 명령 또는 질문을 입력하세요..."
                                        : "궁금한 점을 질문하세요..."
                                }
                                className="flex-1 px-3.5 py-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-xs text-stone-100 focus:outline-none focus:border-amber-500/60"
                            />
                            <button
                                type="submit"
                                disabled={busy}
                                className="px-4 py-2.5 rounded-xl bg-amber-400 text-zinc-950 font-semibold text-xs hover:bg-amber-300"
                            >
                                전송
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

            onUploadWatchFile,

            onUpdateOrderStatus,
            messages,
            registeredUsers,
            loginLogs,

            setSelectedRecipientEmail,
            directMessageInput,
            setDirectMessageInput,
            directMessageNotice,
            onSendDirectMessage,

            setBroadcastInput,

                },

                const cmd = studioPrompt.trim();
                if (!cmd) return;
                setStudioLogs((prev) => [...prev, { role: "user", text: cmd }]);
                setStudioPrompt("");
                const res = await onAdminAiSiteEdit(cmd);
                setStudioLogs((prev) => [...prev, { role: "ai", text: res.reply }]);
            }

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="w-full max-w-3xl rounded-3xl bg-zinc-950 border border-zinc-800 shadow-2xl overflow-hidden flex flex-col max-h-[88vh]">
                        <div className="px-6 py-4 bg-zinc-900 border-b border-zinc-800 flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <Lock className="w-4 h-4 text-amber-300" />
                                <span className="text-sm font-bold text-stone-100">
                                    OURO 관리자 콘솔 & 실시간 AI 사이트 에디터

                            </div>
                            <div className="flex items-center gap-2">
                                {isAdminAuthed && (
                                    <button

                                        onClick={onAdminLogout}
                                        className="px-3 py-1.5 rounded-xl bg-rose-950/70 border border-rose-800/70 text-xs text-rose-200"

                                        관리자 로그아웃
                                    </button>
                                )}
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="p-2 rounded-xl bg-zinc-950 text-zinc-400 hover:text-stone-100"
                                >
                                    <X className="w-4 h-4" />
                                </button>
                            </div>
                        </div>

                        {!isAdminAuthed ? (
                            <form onSubmit={onAdminLogin} className="p-6 sm:p-8 max-w-md mx-auto w-full space-y-4">
                                <div className="text-center space-y-1">
                                    <h3 className="text-lg font-semibold text-stone-100">관리자 본인 인증</h3>
                                    <p className="text-xs text-zinc-400">
                                        관리자 계정으로 로그인하면 사이트 전체 수정 및 AI 스튜디오를 사용할 수 있습니다.
                                    </p>
                                </div>
                                {adminLoginError && (
                                    <div className="p-3 rounded-xl bg-rose-950/70 border border-rose-700/70 text-xs text-rose-200">
                                        {adminLoginError}
                                    </div>
                                )}
                                <div>
                                    <label className="block text-xs text-zinc-400 mb-1">관리자 아이디</label>
                                    <input
                                        type="text"
                                        value={adminIdInput}
                                        onChange={(e) => setAdminIdInput(e.target.value)}
                                        placeholder="관리자 ID 입력"
                                        className="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-800 text-sm text-stone-100"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs text-zinc-400 mb-1">관리자 비밀번호</label>
                                    <input
                                        type="password"
                                        value={adminPwInput}
                                        onChange={(e) => setAdminPwInput(e.target.value)}
                                        placeholder="비밀번호 입력"
                                        className="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-800 text-sm text-stone-100"
                                    />
                                </div>
                                <button
                                    type="submit"
                                    className="w-full py-3 rounded-xl bg-amber-400 text-zinc-950 font-bold text-sm hover:bg-amber-300"
                                >
                                    관리자 콘솔 열기
                                </button>
                            </form>
                        ) : (
                            <>
                                <div className="px-6 py-3 bg-zinc-900/70 border-b border-zinc-800 flex flex-wrap gap-2">
                                    {[
                                        { id: "ai", label: "✨ AI 사이트 수정" },
                                        { id: "watch", label: "시계·가격·사진·테마" },
                                        { id: "orders", label: `주문 관리 (${orders.length})` },
                                        { id: "chat", label: `1:1 채팅 응답 (${messages.length})` },
                                        { id: "members", label: `회원·접속 기록 (${registeredUsers.length})` },
                                    ].map((t) => (
